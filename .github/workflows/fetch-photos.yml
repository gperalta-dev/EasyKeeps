# Temporary: downloads candidate stock photos so they can be reviewed. Deleted after use.
name: Fetch candidate photos
on:
  push:
    branches: [photo-fetch]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[skip fetch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download
        run: |
          mkdir -p photos
          while read -r name id w; do
            curl -fsSL "https://images.unsplash.com/${id}?fm=jpg&q=78&w=${w}" -o "photos/${name}.jpg" || echo "failed ${name}"
          done <<'LIST'
          hero-owner-with-receipts photo-1687422808248-f807f4ea2a2e 2400
          hero-owner-with-receipts-mobile photo-1687293233211-6b0cc3beba70 1200
          story-receipt photo-1654263736203-a289f57c0d82 1400
          story-owner-at-laptop photo-1687293233471-187c8df1beef 2200
          story-cafe-owner photo-1753351052363-53ce102830eb 2200
          story-shop-owner photo-1758887261865-a2b89c0f7ac5 2200
          LIST
          ls -la photos
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          git commit -m "Add candidate photos [skip fetch]"
          git push
